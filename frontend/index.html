<!DOCTYPE html>
<html>
<head>
    <title>PriceOracle</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
</head>

<body>
    <div class="container">
        
        <img 
            src="./assets/logopic.jpg" 
            alt="Website logo" 
            class="logo"
        />

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search products..." /><br>
            <button id="searchBtn">Search</button>
            <div id="message" style="margin-top: 10px; color: white;"></div>
        </div>

        <!-- results area (we keep same id for backward compatibility) -->
        <div id="result" style="margin-top: 20px;"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
